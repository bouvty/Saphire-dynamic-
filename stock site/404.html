<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08060c">
  <meta name="robots" content="noindex, nofollow">
  <title>404 — Page Not Found | Saphire Stock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Unbounded:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--bg:#08060c;--text:#f7f1f9;--muted:#9e92a7;--accent:#bc78ef;--line:#493354}
    *,*::before,*::after{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{background:var(--bg);font-family:"DM Sans",sans-serif;color:var(--text);display:grid;place-items:center;overflow-x:hidden}
    .aura{pointer-events:none;position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 55% 42% at 50% 44%,rgba(116,48,141,.21) 0%,transparent 85%),radial-gradient(ellipse 35% 36% at 93% 93%,rgba(119,38,154,.1),transparent 100%)}
    .orb{position:fixed;z-index:0;width:500px;height:500px;border-radius:50%;border:1px solid rgba(175,100,221,.05);box-shadow:0 0 140px rgba(147,63,188,.08);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;animation:none}
    .wrap{position:relative;z-index:1;text-align:center;max-width:670px;width:100%;padding:65px 24px;animation:rise .65s cubic-bezier(.2,.8,.2,1) both}
    .pill{display:inline-flex;align-items:center;gap:10px;padding:10px 15px;border:1px solid rgba(165,97,213,.27);background:rgba(50,26,65,.38);border-radius:999px;color:#cf94fc;letter-spacing:.17em;font:600 10px "Unbounded",sans-serif}
    .pill i{display:block;width:6px;height:6px;background:#d589fa;border-radius:50%;box-shadow:0 0 14px #d389fb}
    .number{font:800 clamp(100px,25vw,184px)/1.04 "Unbounded",sans-serif;letter-spacing:-.105em;margin:26px 0 14px;padding-right:.08em;background:linear-gradient(155deg,#fff 5%,#dbc1eb 43%,#b26adc 85%);color:transparent;background-clip:text;-webkit-background-clip:text;text-shadow:0 18px 90px rgba(155,63,203,.16)}
    h1{font:700 clamp(21px,4.5vw,29px)/1.4 "Unbounded",sans-serif;letter-spacing:-.065em;margin:0}
    .desc{color:var(--muted);font-size:15px;line-height:1.85;max-width:460px;margin:17px auto 32px}
    .actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
    .button{display:inline-flex;align-items:center;justify-content:center;gap:11px;padding:15px 21px;min-height:52px;border-radius:13px;text-decoration:none;font-size:13px;font-weight:700;border:1px solid var(--line);transition:transform .2s,border-color .2s,background .2s,box-shadow .2s;color:var(--text)}
    .button:hover{transform:translateY(-3px);border-color:#bd7bef}
    .primary{background:linear-gradient(125deg,#a75ed8,#7239a7);border-color:#bb83e5;box-shadow:0 12px 40px #7832a329}
    .primary:hover{box-shadow:0 16px 42px #a547d441}
    .secondary{background:#17101c}
    .button svg{height:18px;width:18px;stroke-width:1.8}
    .divider{width:70px;height:1px;margin:44px auto 20px;background:linear-gradient(90deg,transparent,#61406f,transparent)}
    .foot{font-size:12px;color:#776982}
    @keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    
    @media(max-width:450px){.wrap{padding:40px 18px}.button{flex:1 1 100%}.number{margin:30px 0 12px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="aura" aria-hidden="true"></div><div class="orb" aria-hidden="true"></div>
  <main class="wrap">
    <div class="pill"><i aria-hidden="true"></i> SAPHIRE STOCK / ERROR</div>
    <div class="number" aria-hidden="true">404</div>
    <h1>Page not found.</h1>
    <p class="desc">The page you are looking for doesn't exist, has moved, or is no longer available.</p>
    <div class="actions">
      <a class="button primary" href="/" aria-label="Return to Saphire stock homepage">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
        Back to Stock
      </a>
      <a class="button secondary" href="https://saphire.rip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h2l2 12h13l2-9H6"/><circle cx="10" cy="20" r="1"/><circle cx="19" cy="20" r="1"/></svg>
        Visit Saphire
      </a>
    </div>
    <div class="divider" aria-hidden="true"></div>
    <div class="foot">The stock page is still available.</div>
  </main>
</body>
</html>
