<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#070708">
  <title>Access Declined — Saphire API</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;background:#070708;color:#f8f8f9;display:grid;place-items:center;overflow:hidden}
    body:before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse 34% 34% at 50% 44%,rgba(102,16,23,.16),transparent 75%),linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);background-size:auto,64px 64px,64px 64px;mask-image:linear-gradient(to bottom,transparent,#000 25%,#000 75%,transparent);pointer-events:none}
    .shell{position:relative;width:min(100% - 36px,520px);padding:46px 34px 36px;text-align:center;border:1px solid #27272a;border-radius:22px;background:linear-gradient(160deg,#151516 0%,#0b0b0c 65%);box-shadow:0 32px 100px #000b,0 1px 0 #ffffff0a inset;animation:enter .65s cubic-bezier(.2,.7,.2,1) both}
    .brand{position:absolute;top:-44px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:10px;letter-spacing:.23em;font-size:11px;font-weight:800;color:#c8c8cb}
    .mark{display:grid;place-items:center;width:23px;height:23px;border:1px solid #ffffff30;border-radius:7px;color:white;font-weight:900;font-size:14px;letter-spacing:-.08em}
    .symbol{height:82px;width:82px;margin:0 auto 25px;display:grid;place-items:center;border-radius:23px;background:linear-gradient(145deg,#371318,#180d10);border:1px solid #703038;box-shadow:0 0 0 9px #75192312,0 0 52px #a6172020;color:#e2636d;transform:rotate(-4deg)}
    .symbol svg{height:41px;width:41px;transform:rotate(4deg)}
    .eyebrow{font-size:11px;font-weight:700;letter-spacing:.21em;color:#b1b1b6;text-transform:uppercase;margin-bottom:11px}
    h1{margin:0;letter-spacing:-.055em;font-size:clamp(37px,7vw,52px);line-height:1.08;font-weight:750}
    p{max-width:340px;margin:19px auto 27px;color:#96969c;line-height:1.7;font-size:14px}
    .rule{height:1px;background:linear-gradient(90deg,transparent,#303034,transparent);margin:0 0 22px}
    .footer{display:flex;align-items:center;justify-content:center;gap:8px;font-size:11px;letter-spacing:.07em;color:#6d6d73}
    .dot{height:6px;width:6px;border-radius:50%;background:#b9464f;box-shadow:0 0 13px #bc333b80}
    @keyframes enter{from{opacity:0;transform:translateY(15px) scale(.98)}to{opacity:1;transform:none}}
    @media(max-width:480px){.shell{padding:38px 22px 30px}.brand{top:-39px}.symbol{height:70px;width:70px;border-radius:20px}.symbol svg{height:34px}}
    @media(prefers-reduced-motion:reduce){.shell{animation:none}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand"><span class="mark">S</span>SAPHIRE / API</div>
    <div class="symbol" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2.8 19.2a1.25 1.25 0 0 0 1.1 1.8h16.2a1.25 1.25 0 0 0 1.1-1.8L12 3Z"/><path d="M12 9v5"/><path d="M12 17.6h.01" stroke-width="2.6"/></svg>
    </div>
    <div class="eyebrow">Error 404 · Restricted Endpoint</div>
    <h1>Access Declined.</h1>
    <p>This API endpoint is unavailable or doesn't exist. Check the request URL and try again.</p>
    <div class="rule"></div>
    <div class="footer"><span class="dot"></span> SAPHIRE SYSTEMS <span aria-hidden="true">·</span> REQUEST DENIED</div>
  </main>
</body>
</html>
